<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGS Games Shop - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,"Noto Sans Bengali",sans-serif}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:100%;max-width:400px;background:#111a2d;border:1px solid #30446e;border-radius:18px;padding:25px;box-shadow:0 15px 50px #0008}
h1{text-align:center;font-size:22px;margin:0 0 8px}
p{text-align:center;color:#9eabc4;margin:0 0 25px}
label{display:block;margin:10px 0 7px;color:#c5cee0;font-size:14px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #3a4d76;background:#091222;color:#fff;font-size:16px;outline:none}
button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#5b7cff;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
#error{color:#ff7777;text-align:center;margin-top:12px;font-size:14px}
#panel{display:none;min-height:100vh}
header{padding:15px 18px;background:#10192b;border-bottom:1px solid #273858;display:flex;justify-content:space-between;align-items:center}
header b{font-size:19px}
.logout{width:auto;margin:0;background:#ef4444;padding:9px 14px}
main{max-width:1100px;margin:auto;padding:20px}
.card{background:#111a2d;border:1px solid #293a60;border-radius:15px;padding:20px;margin-bottom:18px}
h2{margin:0 0 8px;font-size:18px}
.muted{color:#94a2bb;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="box">
    <h1>🎮 MGS Games Shop</h1>
    <p>Admin Panel Login</p>
    <label>Admin Password</label>
    <input id="adminPassword" type="password" placeholder="Enter your password" autocomplete="off">
    <button type="button" onclick="adminLogin()">Login to Admin Panel</button>
    <div id="error"></div>
  </div>
</div>

<div id="panel">
<header>
  <b>🎮 MGS Games Shop — Admin</b>
  <button class="logout" onclick="adminLogout()">Logout</button>
</header>
<main>
  <div class="grid">
    <div class="card"><h2>💳 Payment Settings</h2><div class="muted">bKash / Nagad নম্বর পরিবর্তনের জায়গা</div></div>
    <div class="card"><h2>📦 Package Management</h2><div class="muted">Package, Diamond ও Price management</div></div>
    <div class="card"><h2>🧾 Orders</h2><div class="muted">Customer orders ও order status</div></div>
    <div class="card"><h2>👥 Customers</h2><div class="muted">Customer account information</div></div>
  </div>
</main>
</div>

<script>
function adminLogin(){
  const password = document.getElementById("adminPassword").value;
  if(password === "MARUF@18334341"){
    document.getElementById("login").style.display="none";
    document.getElementById("panel").style.display="block";
    sessionStorage.setItem("mgs_admin_logged_in","yes");
    document.getElementById("error").textContent="";
  }else{
    document.getElementById("error").textContent="আপনার পাসওয়ার্ডটি সঠিক নয়।";
  }
}
function adminLogout(){
  sessionStorage.removeItem("mgs_admin_logged_in");
  document.getElementById("panel").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("adminPassword").value="";
}
document.getElementById("adminPassword").addEventListener("keydown",function(e){
  if(e.key==="Enter") adminLogin();
});
if(sessionStorage.getItem("mgs_admin_logged_in")==="yes"){
  document.getElementById("login").style.display="none";
  document.getElementById("panel").style.display="block";
}
</script>
</body>
</html>
